# Default configuration for all pipeline stages.
# Override per-stage values by passing --config <path> to each script.

project:
  name: cryoem_cellstate
  seed: 42
  device: "auto" # "auto" | "cuda" | "cpu"
  results_dir: "results"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  masks_dir: "data/masks"
  crops_dir: "data/crops"
  cvat_gt_dir: "data/cvat_gt"
  image_extensions: [".tif", ".tiff", ".png", ".jpg", ".jpeg"]

# ── Stage 1: Preprocessing ────────────────────────────────────────────────────
preprocessing:
  output_format: "npy" # "npy" | "pt"
  fft_filter:
    low_cutoff: 0.02 # fraction of Nyquist (0–1)
    high_cutoff: 0.4
    high_pass_only: false
  background:
    method: "gaussian" # "gaussian" | "tophat"
    sigma: 50
    tophat_radius: 40
  clahe:
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  noise_stats:
    results_dir: "results/stage1/noise"

# ── Stage 2: Segmentation ─────────────────────────────────────────────────────
segmentation:
  classical:
    method: "otsu" # "otsu" | "adaptive"
    min_cell_area: 500 # pixels
    max_cell_area: 50000
    watershed: true
  unet:
    in_channels: 1
    num_classes: 1
    lr: 1.0e-4
    batch_size: 4         # UNETR is memory-heavier than a plain UNet
    epochs: 50
    val_fraction: 0.15
    unetr:
      feature_size: 16    # CNN decoder feature map size
      hidden_size: 768    # ViT encoder hidden dim
      mlp_dim: 3072       # ViT encoder MLP intermediate dim
      num_heads: 12       # self-attention heads (must divide hidden_size)
      pos_embed: "conv"   # "conv" | "perceptron"
      dropout_rate: 0.0
  crop_cells:
    min_area: 500
    max_aspect_ratio: 4.0
    crop_size: 128 # padded square output size
    results_dir: "results/stage2"

# ── Stage 3: Self-Supervised Learning ────────────────────────────────────────
ssl:
  backbone: "resnet18" # "resnet18" | "convnext_tiny" | "vit_small_patch16_224"
  embedding_dim: 128
  simclr:
    temperature: 0.07
    lr: 3.0e-4
    batch_size: 256
    epochs: 200
    projection_dim: 128
    augmentation:
      crop_scale: [0.2, 1.0]
      flip: true
      rotation_degrees: 15
      gaussian_blur_kernel: 23
      gaussian_noise_std: 0.05
  mae:
    mask_ratio: 0.75
    lr: 1.5e-4
    batch_size: 64
    epochs: 100

  checkpoints_dir: "results/ssl_checkpoints"

# ── Stage 4: Morphometrics ───────────────────────────────────────────────────
morphometrics:
  glcm_distances: [1, 3, 5]
  glcm_angles: [0, 0.785, 1.571, 2.356] # 0°, 45°, 90°, 135°
  output_path: "results/morphometrics.parquet"

# ── Stage 5: Clustering ──────────────────────────────────────────────────────
clustering:
  pca:
    n_components: 50     # PCA components fed into UMAP (noise reduction)
    whiten: false
    random_state: 42
  umap:
    n_neighbors: 15
    min_dist: 0.1
    n_components_2d: 2
    n_components_cluster: 10
    metric: "euclidean"
    random_state: 42
  hdbscan:
    min_cluster_size: 15
    min_samples: 5
    metric: "euclidean"
  bootstrap_iterations: 100
  results_dir: "results/clustering"

# ── Stage 6: Evaluation ──────────────────────────────────────────────────────
evaluation:
  significance_alpha: 0.05
  figures_dir: "results/figures"
  report_path: "results/report.md"
