# Default configuration for all pipeline stages.
# Override per-stage values by passing --config <path> to each script.

project:
  name: cryoem_cellstate
  seed: 42
  device: "auto"      # "auto" | "cuda" | "cpu"
  results_dir: "results"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  masks_dir: "data/masks"
  crops_dir: "data/crops"
  cvat_gt_dir: "data/cvat_gt"
  image_extensions: [".tif", ".tiff", ".png", ".jpg", ".jpeg"]

# ── Stage 1: Preprocessing ────────────────────────────────────────────────────
preprocessing:
  output_format: "npy"    # "npy" | "pt"
  fft_filter:
    low_cutoff: 0.02      # fraction of Nyquist (0–1)
    high_cutoff: 0.4
    high_pass_only: false
  background:
    method: "gaussian"    # "gaussian" | "tophat"
    sigma: 50
    tophat_radius: 40
  clahe:
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  noise_stats:
    results_dir: "results/stage1/noise"

# ── Stage 2: Segmentation ─────────────────────────────────────────────────────
segmentation:
  classical:
    method: "otsu"        # "otsu" | "adaptive"
    min_cell_area: 500    # pixels
    max_cell_area: 50000
    watershed: true
  segmentation_model:
    in_channels: 1
    num_classes: 1
    lr: 1.0e-4
    batch_size: 4
    epochs: 50
    val_fraction: 0.15
    # VISTA2D — pretrained SAM ViT-B foundation model for cell segmentation
    # Weights are downloaded from HuggingFace Hub on first use.
    vista2d:
      hf_repo: "MONAI/vista2d"        # HuggingFace repository ID
      hf_revision: "0.4.0"             # pinned model version
      cache_dir: "~/.cache/monai/vista2d"  # local weight cache
      roi_size: [256, 256]             # sliding-window tile size
      sw_batch_size: 4                 # tiles per GPU batch
      overlap: 0.25                    # tile overlap fraction
  crop_cells:
    min_area: 500
    max_aspect_ratio: 4.0
    crop_size: 128              # padded square output size
    results_dir: "results/stage2"

# ── Stage 3: Self-Supervised Learning ────────────────────────────────────────
# active_model controls which model run_ssl.py uses by default.
# Training is always done via the dedicated train_*_lightning.py scripts.
ssl:
  active_model: "cryo-ief"           # "mae" | "cryo-ief" | "rotnet"
  checkpoints_dir: "results/ssl_checkpoints"

  # -- MAE-ViT (pretrained, no local training) ----------------------------------
  mae:
    backbone: "hf_hub:timm/vit_base_patch16_224.mae_in1k"
    image_size: 224
    batch_size: 64

  # -- DINOv3 ViT-Large (pretrained via HuggingFace transformers ≥ 4.56.0) -----
  rotnet:
    model_name: "facebook/dinov3-vitl16-pretrain-lvd1689m"
    image_size: 224
    batch_size: 32

  # -- Cryo-IEF (foundation model, zero-shot — no local training needed) -------
  cryo_ief:
    model_name: "westlake-repl/Cryo-IEF"
    image_size: 224
    batch_size: 64

# ── Stage 4: Morphometrics ───────────────────────────────────────────────────
morphometrics:
  glcm_distances: [1, 3, 5]
  glcm_angles: [0, 0.785, 1.571, 2.356]  # 0°, 45°, 90°, 135°
  output_path: "results/morphometrics.parquet"

# ── Stage 5: Clustering ──────────────────────────────────────────────────────
clustering:
  pca:
    n_components: 50
    whiten: false
    random_state: 42
  umap:
    n_neighbors: 15
    min_dist: 0.1
    n_components_2d: 2
    n_components_cluster: 10
    metric: "euclidean"
    random_state: 42
  hdbscan:
    min_cluster_size: 15
    min_samples: 5
    metric: "euclidean"
  bootstrap_iterations: 100
  results_dir: "results/clustering"

# ── Stage 6: Evaluation ──────────────────────────────────────────────────────
evaluation:
  significance_alpha: 0.05
  figures_dir: "results/figures"
  report_path: "results/report.md"

# ── Weights & Biases ─────────────────────────────────────────────────────────
wandb:
  enabled: true
  project: "cryoem-cellstate"
  entity: null          # set to your W&B username/team or leave null for default
  log_figures: true     # upload PNG figures as wandb.Image artifacts
