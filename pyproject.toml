[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryoem_cellstate"]

[project]
name = "cryoem"
version = "0.1.0"
description = "Automated discovery of morphological cell states in CryoEM images via SSL + unsupervised clustering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15.0", # parquet I/O
    # Image processing
    "opencv-python>=4.9",
    "scikit-image>=0.23",
    "Pillow>=10.3",
    # Deep learning
    "torch>=2.2",
    "torchvision>=0.17",
    "monai>=1.3",
    "timm>=0.9",
    "transformers>=4.40",
    "lightning>=2.2",
    # VISTA2D cell segmentation (SAM ViT-B foundation model)
    "huggingface_hub>=0.23",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
    # SSL / representation learning
    "einops>=0.7",
    # Unsupervised analysis
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "scikit-learn>=1.4",
    # Config & CLI
    "pyyaml>=6.0",
    "click>=8.1",
    # Plotting & reporting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pydantic>=2.12.5",
    "wandb>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
testpaths = ["cryoem_cellstate/tests"]
pythonpath = ["cryoem_cellstate"]   # makes "from src.xxx import yyy" resolve
addopts = "-v --tb=short"

[tool.hatch.metadata]
allow-direct-references = true
